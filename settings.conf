# Shared, non-personal defaults.
#
# Personal settings (git identity) are asked on first run and saved to
# settings.local.conf, which is gitignored. Any value here can also be
# overridden there.

# Countries to rank pacman mirrors for, comma-separated; blank = worldwide.
# Set here so install.sh doesn't ask; override in settings.local.conf.
MIRROR_COUNTRIES="India,Singapore"

# zram swap size, as a zram-generator expression.
ZRAM_SIZE="ram / 2"
