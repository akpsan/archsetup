# hyprlock — Catppuccin Mocha, matches waybar

$base     = rgb(1e1e2e)
$surface0 = rgb(313244)
$text     = rgb(cdd6f4)
$subtext  = rgb(a6adc8)
$blue     = rgb(89b4fa)
$mauve    = rgb(cba6f7)
$green    = rgb(a6e3a1)
$yellow   = rgb(f9e2af)
$red      = rgb(f38ba8)
$peach    = rgb(fab387)
$font     = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint:enabled = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Blurred screenshot of the desktop
background {
    monitor =
    path = screenshot
    color = $base
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.17
}

# Time
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 20
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =   $USER
    color = $mauve
    font_size = 14
    font_family = $font Bold
    position = 0, -40
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    rounding = 12
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = $blue $green 45deg
    inner_color = $surface0
    font_color = $text
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">󰌾  Password</span>
    hide_input = false

    check_color = $yellow
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $peach

    position = 0, -120
    halign = center
    valign = center
}

# Keyboard layout / caps lock hint
label {
    monitor =
    text = $LAYOUT
    color = $subtext
    font_size = 11
    font_family = $font
    position = 0, -175
    halign = center
    valign = center
}
